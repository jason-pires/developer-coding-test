name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  AWS_REGION: us-east-1
  ECR_REPOSITORY: <ECR_REPOSITORY>
  ECS_CLUSTER: <ECS_CLUSTER>
  ECS_SERVICE: <ECS_SERVICE>
  ECS_TASK_DEFINITION: <ECS_TASK_DEFINITION_FAMILY>
  ECS_CONTAINER_NAME: <ECS_CONTAINER_NAME>

jobs:
  build:
    name: Build, Test and Package
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Core.sln

      - name: Build
        run: dotnet build Core.sln --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test Tests/UnitTests/UnitTests.csproj --configuration Release --no-build --logger "trx;LogFileName=unit-tests.trx" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults

      - name: Compute image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

